services:
  teslamate:
    image: teslamate/teslamate:latest
    restart: always
    environment:
      - ENCRYPTION_KEY=${TESLAMATE_ENCRYPTION_KEY}
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TESLAMATE_DB_PASSWORD}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
      - MQTT_HOST=mosquitto
      - TZ=${TZ}
    ports:
      - "4000:4000"
    volumes:
      - ./import:/opt/app/import
    cap_drop:
      - all
    depends_on:
      - database
      - mosquitto

  database:
    image: postgres:18-trixie
    restart: always
    environment:
      - POSTGRES_USER=teslamate
      - POSTGRES_PASSWORD=${TESLAMATE_DB_PASSWORD}
      - POSTGRES_DB=teslamate
    volumes:
      - teslamate-db:/var/lib/postgresql

  grafana:
    image: teslamate/grafana:latest
    restart: always
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TESLAMATE_DB_PASSWORD}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
      - TZ=${TZ}
    ports:
      - "3000:3000"
    volumes:
      - teslamate-grafana-data:/var/lib/grafana
    depends_on:
      - database

  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-conf:/mosquitto/config
      - mosquitto-data:/mosquitto/data

  teslamateapi:
    image: tobiasehlert/teslamateapi:latest
    restart: always
    environment:
      - ENCRYPTION_KEY=${TESLAMATE_ENCRYPTION_KEY}
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${TESLAMATE_DB_PASSWORD}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
      - MQTT_HOST=mosquitto
      - TZ=${TZ}
      - API_TOKEN=${MATE_LINK_API_TOKEN}
      - API_TOKEN_HEADER=Authorization
    depends_on:
      - database
      - mosquitto
      - teslamate

  matelink-adapter:
    build:
      context: ./adapter
    restart: always
    environment:
      - DATABASE_URL=postgres://teslamate:${TESLAMATE_DB_PASSWORD}@database:5432/teslamate?sslmode=disable
      - UPSTREAM_URL=http://teslamateapi:8080
      - API_TOKEN=${MATE_LINK_API_TOKEN}
      - TZ=${TZ}
      - MQTT_ENABLED=${MQTT_ENABLED:-true}
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_NAMESPACE=${MQTT_NAMESPACE:-}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
    ports:
      # Windows commonly reserves 8055-8154; expose the host API outside that range.
      - "18080:8080"
    depends_on:
      - database
      - mosquitto
      - teslamateapi

volumes:
  teslamate-db:
  teslamate-grafana-data:
  mosquitto-conf:
  mosquitto-data:
