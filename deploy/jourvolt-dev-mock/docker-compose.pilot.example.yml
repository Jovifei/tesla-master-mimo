services:
  jourvolt-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jourvolt}
      POSTGRES_USER: ${POSTGRES_USER:-jourvolt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - jourvolt-pilot-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  jourvolt-api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      LISTEN_ADDR: :8080
      JOURVOLT_ENABLE_MOCK: "false"
      JOURVOLT_ENABLE_MOCK_HISTORY: "false"
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:?set TESLA_CLIENT_ID in .env}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET:?set TESLA_CLIENT_SECRET in .env}
      TESLA_REDIRECT_URI: ${TESLA_REDIRECT_URI:?set TESLA_REDIRECT_URI in .env}
      JOURVOLT_APP_LINK_URI: ${JOURVOLT_APP_LINK_URI:?set JOURVOLT_APP_LINK_URI in .env}
      JOURVOLT_TOKEN_KEY_BASE64: ${JOURVOLT_TOKEN_KEY_BASE64:?set JOURVOLT_TOKEN_KEY_BASE64 in .env}
      TESLA_AUTH_URL: ${TESLA_AUTH_URL:-https://auth.tesla.cn/oauth2/v3/authorize}
      TESLA_TOKEN_URL: ${TESLA_TOKEN_URL:-https://auth.tesla.cn/oauth2/v3/token}
      TESLA_ISSUER: ${TESLA_ISSUER:-https://auth.tesla.cn/oauth2/v3/nts}
      TESLA_JWKS_URL: ${TESLA_JWKS_URL:-https://auth.tesla.cn/oauth2/v3/discovery/thirdparty/keys}
      TESLA_FLEET_API_BASE: ${TESLA_FLEET_API_BASE:-https://fleet-api.prd.cn.vn.cloud.tesla.cn}
    depends_on:
      jourvolt-postgres:
        condition: service_healthy
    ports:
      - "${JOURVOLT_BIND:-127.0.0.1:18090}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  jourvolt-edge:
    image: caddy:2.8-alpine
    profiles: ["edge"]
    restart: unless-stopped
    environment:
      JOURVOLT_API_DOMAIN: ${JOURVOLT_API_DOMAIN:?set JOURVOLT_API_DOMAIN in .env}
      JOURVOLT_APP_DOMAIN: ${JOURVOLT_APP_DOMAIN:?set JOURVOLT_APP_DOMAIN in .env}
      JOURVOLT_ACME_EMAIL: ${JOURVOLT_ACME_EMAIL:?set JOURVOLT_ACME_EMAIL in .env}
    depends_on:
      jourvolt-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      # Full checkout default: ../../web_matelink/public. A generated Pilot
      # bundle sets JOURVOLT_PUBLIC_ROOT=./public instead.
      # The deployment-specific App Link file is mounted separately and
      # remains absent until the formal release fingerprint is supplied.
      - ${JOURVOLT_PUBLIC_ROOT:-../../web_matelink/public}:/srv:ro
      - ./public/.well-known:/srv/.well-known:ro
      - jourvolt-caddy-data:/data
      - jourvolt-caddy-config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  jourvolt-pilot-postgres:
  jourvolt-caddy-data:
  jourvolt-caddy-config:
