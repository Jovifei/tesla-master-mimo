# P1 ECS pilot compose: API only.
#
# Design (docs/ARCH-2026-08-28-jourvolt-deploy.md 5.4):
#   - single `jourvolt-dev-api` service; the PostgreSQL instance is external
#     (the running `jourvolt-staging` postgres on the `jourvolt-staging_default`
#     network by default; switch JOURVOLT_DB_NETWORK to `jourvolt-infra` after
#     the shared-instance migration in ARCH 5.4).
#   - no edge service and no 80/443 binding: host nginx already terminates
#     HTTPS for api./auth.teslalink.joviluma.com and proxies to 127.0.0.1:18090.
#   - the loopback port mapping matches the existing nginx upstream.
#
# Usage on the ECS host (see docs/JOURVOLT-ECS-SECRET-SETUP.md):
#   docker compose --env-file .env -f docker-compose.pilot.ecs.yml config --quiet
#   docker compose --env-file .env -f docker-compose.pilot.ecs.yml up -d --build
#
# NOTE: stop the old mock `jourvolt-dev-api` container from docker-compose.yml
# before starting this project, otherwise 127.0.0.1:18090 conflicts:
#   docker compose -f docker-compose.yml stop jourvolt-dev-api

name: jourvolt-pilot

services:
  jourvolt-dev-api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://jourvolt:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD or DATABASE_URL in .env}@jourvolt-postgres:5432/jourvolt?sslmode=disable}
      LISTEN_ADDR: :8080
      JOURVOLT_ENABLE_MOCK: "false"
      JOURVOLT_ENABLE_MOCK_HISTORY: "false"
      # Empty Tesla values keep the API in fail-closed `unconfigured` mode:
      # it boots and reports 503 oauth_not_configured until Jovi fills the
      # two secrets in the private .env. Nothing is printed to logs.
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:-}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET:-}
      TESLA_REDIRECT_URI: ${TESLA_REDIRECT_URI:?set TESLA_REDIRECT_URI in .env}
      JOURVOLT_APP_LINK_URI: ${JOURVOLT_APP_LINK_URI:?set JOURVOLT_APP_LINK_URI in .env}
      JOURVOLT_TOKEN_KEY_BASE64: ${JOURVOLT_TOKEN_KEY_BASE64:?set JOURVOLT_TOKEN_KEY_BASE64 in .env}
      TESLA_AUTH_URL: ${TESLA_AUTH_URL:-https://auth.tesla.cn/oauth2/v3/authorize}
      TESLA_TOKEN_URL: ${TESLA_TOKEN_URL:-https://auth.tesla.cn/oauth2/v3/token}
      TESLA_ISSUER: ${TESLA_ISSUER:-https://auth.tesla.cn/oauth2/v3}
      TESLA_JWKS_URL: ${TESLA_JWKS_URL:-https://auth.tesla.cn/oauth2/v3/discovery/keys}
      TESLA_FLEET_API_BASE: ${TESLA_FLEET_API_BASE:-https://fleet-api.prd.cn.vn.cloud.tesla.cn}
      TESLA_PARTNER_DOMAIN: ${TESLA_PARTNER_DOMAIN:-auth.teslalink.joviluma.com}
      TELEMETRY_MQTT_URL: ${TELEMETRY_MQTT_URL:-}
      TELEMETRY_MQTT_USERNAME: ${TELEMETRY_MQTT_USERNAME:-}
      TELEMETRY_MQTT_PASSWORD: ${TELEMETRY_MQTT_PASSWORD:-}
      TELEMETRY_MQTT_TOPIC_BASE: ${TELEMETRY_MQTT_TOPIC_BASE:-}
      TELEMETRY_PUBLIC_HOST: ${TELEMETRY_PUBLIC_HOST:-}
      TELEMETRY_PUBLIC_PORT: ${TELEMETRY_PUBLIC_PORT:-}
      TELEMETRY_COMMAND_PROXY_URL: ${TELEMETRY_COMMAND_PROXY_URL:-}
      TELEMETRY_CA_CERT_PATH: /run/secrets/fleet/ca.pem
      TELEMETRY_VIN_HASH_KEY_BASE64: ${TELEMETRY_VIN_HASH_KEY_BASE64:-}
    ports:
      - "127.0.0.1:18090:8080"
    networks:
      - db
      - telemetry
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${TELEMETRY_CA_CHAIN_FILE:-/srv/jourvolt-secrets/fleet-telemetry/ca.pem}:/run/secrets/fleet/ca.pem:ro

  jourvolt-mqtt:
    image: eclipse-mosquitto:2.0.20
    profiles: ["telemetry"]
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MQTT_USERNAME: ${TELEMETRY_MQTT_USERNAME:-}
      MQTT_PASSWORD: ${TELEMETRY_MQTT_PASSWORD:-}
    command: ["/bin/sh", "-c", "mosquitto_passwd -b -c /mosquitto/data/passwd \"$$MQTT_USERNAME\" \"$$MQTT_PASSWORD\" && exec mosquitto -c /mosquitto/config/mosquitto.conf"]
    volumes:
      - ./fleet-telemetry/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - jourvolt-mqtt-data:/mosquitto/data
    networks:
      - telemetry
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6

  vehicle-command-proxy:
    # Tesla's official HTTP proxy signs Fleet Telemetry configuration with the
    # application's virtual-key private key. It is deliberately private: only
    # the API can reach it through the internal telemetry network.
    image: ${TESLA_VEHICLE_COMMAND_IMAGE:-example.invalid/jourvolt/vehicle-command:unconfigured}
    profiles: ["telemetry"]
    restart: unless-stopped
    mem_limit: 128m
    # Run as the deploy user (uid 1000) so the container can read the
    # 0600-owned virtual-key private key and TLS material mounted below.
    # The official image runs as a non-root uid (65532) by default, which
    # cannot read those files and crashes with "permission denied".
    user: "${JOURVOLT_UID:-1000}:${JOURVOLT_GID:-1000}"
    command: ["-tls-key", "/run/secrets/vehicle-command/tls.key", "-cert", "/run/secrets/vehicle-command/tls.crt", "-key-file", "/run/secrets/vehicle-command/fleet-key.pem", "-host", "0.0.0.0", "-port", "4444"]
    expose:
      - "4444"
    volumes:
      - ${TELEMETRY_COMMAND_PROXY_CERT_FILE:-/srv/jourvolt-secrets/fleet-telemetry/command-proxy.crt}:/run/secrets/vehicle-command/tls.crt:ro
      - ${TELEMETRY_COMMAND_PROXY_KEY_FILE:-/srv/jourvolt-secrets/fleet-telemetry/command-proxy.key}:/run/secrets/vehicle-command/tls.key:ro
      - ${TELEMETRY_VEHICLE_COMMAND_KEY_FILE:-/srv/jourvolt-secrets/fleet-telemetry/fleet-key.pem}:/run/secrets/vehicle-command/fleet-key.pem:ro
    networks:
      - telemetry
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  fleet-telemetry:
    # An unset image must never select an official digest implicitly. The renderer
    # rejects the empty setting before this profile service can start.
    image: ${FLEET_TELEMETRY_IMAGE:-example.invalid/jourvolt/fleet-telemetry:unconfigured}
    profiles: ["telemetry"]
    restart: unless-stopped
    mem_limit: 256m
    # Run as the deploy user (uid 1000) so the process can read the rendered
    # config and the 0600-owned TLS material. The official image defaults to a
    # non-root uid (65532) which cannot read either, crashing on startup.
    user: "${JOURVOLT_UID:-1000}:${JOURVOLT_GID:-1000}"
    command: ["/fleet-telemetry", "-config=/etc/fleet-telemetry/server_config.json"]
    depends_on:
      jourvolt-mqtt:
        condition: service_healthy
      fleet-telemetry-config:
        condition: service_completed_successfully
    ports:
      - "${TELEMETRY_PUBLIC_BIND:-0.0.0.0}:${TELEMETRY_PUBLIC_PORT:-4443}:4443"
    expose:
      - "8080"
    volumes:
      - ./fleet-telemetry/rendered:/etc/fleet-telemetry:ro
      - ${TELEMETRY_SERVER_CERT_FILE:-/srv/jourvolt-secrets/fleet-telemetry/server.crt}:/run/secrets/fleet/server.crt:ro
      - ${TELEMETRY_SERVER_KEY_FILE:-/srv/jourvolt-secrets/fleet-telemetry/server.key}:/run/secrets/fleet/server.key:ro
    networks:
      - telemetry
      - default
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  fleet-telemetry-config:
    image: alpine:3.20
    profiles: ["telemetry"]
    restart: "no"
    mem_limit: 64m
    # Run as the deploy user so the rendered file is owned by uid 1000 and is
    # directly readable by the fleet-telemetry process.
    user: "${JOURVOLT_UID:-1000}:${JOURVOLT_GID:-1000}"
    environment:
      FLEET_TELEMETRY_IMAGE: ${FLEET_TELEMETRY_IMAGE:-}
      TELEMETRY_MQTT_URL: ${TELEMETRY_MQTT_URL:-}
      TELEMETRY_MQTT_USERNAME: ${TELEMETRY_MQTT_USERNAME:-}
      TELEMETRY_MQTT_PASSWORD: ${TELEMETRY_MQTT_PASSWORD:-}
      TELEMETRY_MQTT_TOPIC_BASE: ${TELEMETRY_MQTT_TOPIC_BASE:-}
      TELEMETRY_PUBLIC_PORT: ${TELEMETRY_PUBLIC_PORT:-4443}
      TELEMETRY_SERVER_CERT_PATH: /run/secrets/fleet/server.crt
      TELEMETRY_SERVER_KEY_PATH: /run/secrets/fleet/server.key
      JOURVOLT_UID: ${JOURVOLT_UID:-1000}
      JOURVOLT_GID: ${JOURVOLT_GID:-1000}
    command: ["/bin/sh", "/render-server-config.sh"]
    volumes:
      - ./fleet-telemetry/server_config.json.template:/template/server_config.json.template:ro
      - ./fleet-telemetry/render-server-config.sh:/render-server-config.sh:ro
      - ${TELEMETRY_SERVER_CERT_FILE:-/srv/jourvolt-secrets/fleet-telemetry/server.crt}:/run/secrets/fleet/server.crt:ro
      - ${TELEMETRY_SERVER_KEY_FILE:-/srv/jourvolt-secrets/fleet-telemetry/server.key}:/run/secrets/fleet/server.key:ro
      - ./fleet-telemetry/rendered:/rendered

networks:
  db:
    name: ${JOURVOLT_DB_NETWORK:-jourvolt-staging_default}
    external: true
  # The telemetry network stays internal so the MQTT broker and vehicle-command
  # proxy are never reachable from the internet. fleet-telemetry additionally
  # attaches to `default` (non-internal) so its public 4443 port can publish for
  # inbound vehicle connections — an `internal` network has no port mappings.
  telemetry:
    internal: true
  default:
    name: jourvolt-pilot_default

volumes:
  jourvolt-mqtt-data:
