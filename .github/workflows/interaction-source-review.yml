name: Interaction visual fixed-source review
on:
  push:
    branches: [codex/app-interaction-visuals-20261104]
    paths: [.github/workflows/interaction-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 984196d8c1a6deaff124eaa8dd6c45f55c40e700
          path: app-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a64c9e5344f1f4812bb1ab88c1f8957a65781db1
          path: mini-source
          persist-credentials: false
      - name: Export exact tracked source without owner data or credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Jovifei/tesla-master-mimo'
          mkdir -p evidence
          test "$(git -C app-source rev-parse HEAD)" = 984196d8c1a6deaff124eaa8dd6c45f55c40e700
          test "$(git -C mini-source rev-parse HEAD)" = a64c9e5344f1f4812bb1ab88c1f8957a65781db1
          git -C app-source archive --format=tar.gz -o "$GITHUB_WORKSPACE/evidence/app-source.tar.gz" HEAD
          git -C mini-source archive --format=tar.gz -o "$GITHUB_WORKSPACE/evidence/mini-source.tar.gz" HEAD
          for platform in app mini; do
            git -C "$platform-source" show -s --format='%H%n%T%n%P' HEAD > "evidence/$platform-identity.txt"
          done
          cd evidence && sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: interaction-fixed-source
          path: evidence/
          retention-days: 14
          if-no-files-found: error
