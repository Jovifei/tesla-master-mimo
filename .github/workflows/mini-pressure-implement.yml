name: Implement Mini scoped pressure visuals
on:
  push:
    branches: [codex/miniprogram-interaction-complete-20261106]
    paths:
      - tools/interaction-stage/mini-pressure-20261106.py
      - .github/workflows/mini-pressure-implement.yml
permissions:
  contents: read
concurrency:
  group: mini-pressure-implement
  cancel-in-progress: false
jobs:
  implement:
    if: github.repository == 'Jovifei/tesla-master-mimo' && github.ref == 'refs/heads/codex/miniprogram-interaction-complete-20261106'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/miniprogram-interaction-complete-20261106
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            miniprogram/package-lock.json
            miniprogram/test-tooling/package-lock.json
      - name: Apply reviewed patch on its exact owned source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor abc650671018d95332f1c14f82c80062d5061682 HEAD
          mkdir -p pressure-evidence
          git rev-parse HEAD HEAD^{tree} HEAD^ > pressure-evidence/runner-source.txt
          python3 tools/interaction-stage/mini-pressure-20261106.py
          git diff --check
          node --check tools/interaction-stage/browser/capture.mjs
          git diff --binary > pressure-evidence/source.patch
      - name: Real types, complete consumer tests and native bundle
        shell: bash
        working-directory: miniprogram
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund
          npm ci --prefix test-tooling --ignore-scripts --no-fund
          npm run typecheck 2>&1 | tee ../pressure-evidence/types.log
          npm test -- --reporter=default --reporter=junit --outputFile.junit=../pressure-evidence/tests.xml 2>&1 | tee ../pressure-evidence/tests.log
          npm run build:weapp 2>&1 | tee ../pressure-evidence/build.log
          node -e "const p=require('./dist/project.config.json');if(p.setting.urlCheck!==true)throw Error('domain check disabled')"
      - name: Readable actual browser consumers, not native WeChat acceptance
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          node tools/interaction-stage/browser/build.mjs
          node tools/interaction-stage/browser/capture.mjs
      - name: Publish tested source with a normal fast-forward lease
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- android deploy ios web_matelink miniprogram/src/services miniprogram/package.json miniprogram/package-lock.json miniprogram/vehicle-assets
          python3 - <<'PY'
          import json,xml.etree.ElementTree as E
          from pathlib import Path
          root=E.parse('pressure-evidence/tests.xml').getroot(); cases=root.findall('.//testcase')
          result={'tests':len(cases),'failures':len(root.findall('.//failure')),'errors':len(root.findall('.//error')),'skips':len(root.findall('.//skipped'))}
          assert len(cases)>1000 and not result['failures'] and not result['errors'] and not result['skips'],result
          Path('pressure-evidence/counts.json').write_text(json.dumps(result))
          print(result)
          PY
          git add miniprogram/src/components/interaction/InteractionVisuals.tsx miniprogram/src/components/interaction/interaction.scss miniprogram/src/components/interaction/InteractionReceiptRegression.test.tsx miniprogram/src/components/interaction/ConfiguredTpmsVisual.test.tsx miniprogram/src/components/TpmsPanel.tsx miniprogram/src/pages/tools/index.tsx tools/interaction-stage/browser/fixture.tsx tools/interaction-stage/browser/capture.mjs
          git diff --cached --check
          git config user.name 'Jovifei'
          git config user.email '110970864+Jovifei@users.noreply.github.com'
          git commit -m 'fix(mini): wire scoped saved pressure rules into real wheel and trend consumers'
          git rev-parse HEAD HEAD^{tree} HEAD^ > pressure-evidence/tested-source.txt
          git archive --format=zip --output=pressure-evidence/tested-source.zip HEAD
          git fetch origin codex/miniprogram-interaction-complete-20261106
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/miniprogram-interaction-complete-20261106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-scoped-pressure-implementation
          retention-days: 14
          path: |
            pressure-evidence/
            visual-browser-evidence/
