name: Mini release candidate strict review
on:
  push:
    branches: [codex/ui-product-mini-20261109]
    paths: ['.github/workflows/ui-mini-release-review-20261113.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  source:
    if: github.repository == 'Jovifei/tesla-master-mimo'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Use Taro's supported string style boundary
        run: |
          test "$(git rev-parse HEAD^)" = adcff04032cf354665cc1862981c0dd3c8242538
          python3 - <<'PY'
          from pathlib import Path
          p=Path('miniprogram/src/components/PresentationControls.tsx');s=p.read_text()
          a=s.index("        style={daily ? { '--charge-cell-bg':")
          b=s.index('        ariaLabel={`${cell.key}',a)
          s=s[:a]+'''        style={daily ? `--charge-cell-bg:${chargeCellPaint(cell.value, appearance.palette).background};--charge-cell-ink:${chargeCellPaint(cell.value, appearance.palette).foreground};--charge-cell-bg-dark:${chargeCellPaint(cell.value, appearance.palette, true).background};--charge-cell-ink-dark:${chargeCellPaint(cell.value, appearance.palette, true).foreground}` : undefined}
          '''+s[b:]
          p.write_text(s)
          PY
      - id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add miniprogram/src/components/PresentationControls.tsx
          git diff --cached --check
          git commit -m 'fix(mini): serialize scoped palette variables through native supported style prop'
          git push origin HEAD:refs/heads/codex/ui-product-mini-20261109
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: miniprogram
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix test-tooling --ignore-scripts --no-audit --no-fund
          mkdir -p evidence/ui-alignment
          git rev-parse HEAD HEAD^{tree} HEAD^ > evidence/ui-alignment/SOURCE_HEAD.txt
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee evidence/ui-alignment/typecheck.log
      - name: Full regression tests
        if: success() || failure()
        env:
          TZ: Asia/Shanghai
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=evidence/ui-alignment/tests.xml 2>&1 | tee evidence/ui-alignment/tests.log
      - name: WeChat build and original asset budgets
        if: success() || failure()
        run: npm run build:weapp 2>&1 | tee evidence/ui-alignment/build.log
      - name: Independent report guard and final text-source archive
        if: success() || failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as E,subprocess,zipfile
          from pathlib import Path
          with zipfile.ZipFile('evidence/ui-alignment/tested-mini-source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in Path('src').rglob('*'):
              if p.suffix in ('.ts','.tsx','.scss','.css','.json'):z.write(p)
          cases=list(E.parse('evidence/ui-alignment/tests.xml').getroot().iter('testcase'))
          assert len(cases)>=1033,len(cases)
          assert not any(x.find('failure') is not None or x.find('error') is not None or x.find('skipped') is not None for x in cases)
          print(len(cases),'cases, zero failures/errors/skips')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-release-candidate-${{ needs.source.outputs.sha }}
          path: |
            miniprogram/evidence/ui-alignment/
            miniprogram/dist/
          retention-days: 7
          if-no-files-found: error
