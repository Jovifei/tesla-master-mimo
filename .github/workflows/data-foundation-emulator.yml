name: Data foundation isolated API35 Android instrumentation
on:
  push:
    branches: ['codex/apk-data-foundation-remote-20261024', 'codex/app-foundation-ui-integrate-20261025']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: data-foundation-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api35-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Enable KVM for isolated emulator (no device interaction)
        shell: bash
        run: |
          if [[ ! -c /dev/kvm ]]; then
            echo "Hosted virtualization /dev/kvm is unavailable; native tests cannot be claimed." >&2
            exit 2
          fi
          sudo chmod 0666 /dev/kvm
      - name: Record exact isolated runner source and prepare disposable SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p emulator-evidence
          git rev-parse HEAD HEAD^{tree} HEAD^ > emulator-evidence/source.txt
          # Never upload the original local Gradle settings or proxy configuration.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/gradle.properties')
          forbidden={'systemProp.http.proxyHost','systemProp.http.proxyPort',
          'systemProp.https.proxyHost','systemProp.https.proxyPort','systemProp.http.nonProxyHosts'}
          p.write_text('\n'.join(v for v in p.read_text().splitlines()
              if v.split('=',1)[0] not in forbidden)+'\n')
          PY
      - name: Start and independently health-check the existing synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          # Emulator 10.0.2.2 maps to this runner's loopback interface.
          # This is the existing synthetic qualification fixture only, never a
          # provider server or a user's network/vehicle.
          nohup python3 -u tools/p0_qualification/fixture_server.py \
            --host 127.0.0.1 --port 18080 --scenario normal \
            > emulator-evidence/fixture.log 2>&1 </dev/null &
          echo "$!" > emulator-evidence/fixture.pid
          python3 - <<'PY'
          import json,time,urllib.request,os
          pid=int(open('emulator-evidence/fixture.pid').read())
          for attempt in range(30):
              os.kill(pid,0)
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18080/_health',timeout=2) as response:
                      result=json.load(response)
                  if result.get('ok') is True and result.get('scenario')=='normal':
                      print('synthetic_fixture_verified_on_loopback')
                      break
              except (OSError,ValueError,TimeoutError):
                  pass
              time.sleep(0.5)
          else:
              raise SystemExit('synthetic fixture was not listening; native tests must fail')
          PY
      - name: Primary accelerated API35 native Room/Compose tests
        id: primary_api35
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          disk-size: 8G
          emulator-boot-timeout: 700
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -no-snapshot-save -accel on
          script: bash tools/energy-stage/android-instrumentation-ci.sh
      - name: Keep actual instrumentation assertion failures red
        if: steps.primary_api35.outcome == 'failure' && hashFiles('emulator-evidence/instrumentation-started') != ''
        run: |
          echo "Native test assertion/build failed after emulator boot; never retry to hide it." >&2
          exit 1
      - name: Retry a failed emulator BOOT once (not failed native assertions)
        if: steps.primary_api35.outcome == 'failure' && hashFiles('emulator-evidence/instrumentation-started') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          disk-size: 8G
          emulator-boot-timeout: 700
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -no-snapshot-save -accel on
          script: bash tools/energy-stage/android-instrumentation-ci.sh
      - name: Stop the isolated synthetic fixture
        if: always()
        shell: bash
        run: |
          if [[ -s emulator-evidence/fixture.pid ]]; then
            kill "$(cat emulator-evidence/fixture.pid)" 2>/dev/null || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-foundation-api35-instrumentation
          retention-days: 14
          path: |
            emulator-evidence/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
            android/app/build/outputs/apk/androidTest/
