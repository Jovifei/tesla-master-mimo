name: Scoped App review implementation and verification
on:
  push:
    branches: [codex/app-foundation-ui-integrate-20261025]
    paths:
      - tools/remote-review/app-20261103*.py
      - .github/workflows/scoped-app-review-20261103.yml
permissions:
  contents: write
concurrency:
  group: scoped-app-review-20261103
  cancel-in-progress: false
jobs:
  implement-and-test:
    if: github.repository == 'Jovifei/tesla-master-mimo' && github.ref == 'refs/heads/codex/app-foundation-ui-integrate-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 10e501541f33f8856b787b24833e14677a02792d
      TARGET_BRANCH: codex/app-foundation-ui-integrate-20261025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact authorized source and apply guarded edits
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Jovifei/tesla-master-mimo'
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --name-only "$BASE_SHA" HEAD > /tmp/bootstrap-paths
          python3 - <<'PY'
          from pathlib import Path
          allowed={'.github/workflows/scoped-app-review-20261103.yml',
              'tools/remote-review/app-20261103.py', 'tools/remote-review/app-20261103-tests.py'}
          assert set(Path('/tmp/bootstrap-paths').read_text().splitlines()) <= allowed
          PY
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          python3 tools/remote-review/app-20261103.py
          python3 tools/remote-review/app-20261103-tests.py
          git diff --check
          git add android docs/REMOTE-AUDIT-APP-20261103.md
          mkdir -p review-evidence
          git diff --cached --binary > review-evidence/source.patch
          git diff --cached --name-only > review-evidence/changed-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          paths=Path('review-evidence/changed-paths.txt').read_text().splitlines()
          assert len(paths)>=15
          assert all(p.startswith('android/') or p=='docs/REMOTE-AUDIT-APP-20261103.md' for p in paths)
          PY
          git write-tree > review-evidence/TESTED_TREE.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Run real repository Room ViewModel and native compilation regressions
        shell: bash
        run: |
          set -euo pipefail
          cd android
          backup="$(mktemp)"
          cp gradle.properties "$backup"
          trap 'cp "$backup" gradle.properties; rm -f "$backup"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('gradle.properties')
          keys={'systemProp.http.proxyHost','systemProp.http.proxyPort','systemProp.https.proxyHost','systemProp.https.proxyPort','systemProp.http.nonProxyHosts'}
          p.write_text('\n'.join(s for s in p.read_text().splitlines() if s.split('=',1)[0] not in keys)+'\n')
          PY
          export TZ=Asia/Shanghai
          bash ./gradlew :app:assembleDebugAndroidTest :app:testDebugUnitTest \
            --tests '*HistoryFamilyReadTest' --tests '*CostRoomFirstViewModelTest' \
            --tests '*PartialCostTotalsTest' --tests '*HistoryRefreshIntegrationContractTest' \
            --tests '*BatteryRoomRetentionConsumerTest' \
            --no-daemon --max-workers=1 \
            -Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process \
            > ../review-evidence/gradle.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          suites=[E.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          assert sum(int(s.attrib.get('tests',0)) for s in suites)>=20
          assert all(int(s.attrib.get('failures',0))==0 and int(s.attrib.get('errors',0))==0 for s in suites)
          print('REAL_JUNIT', {k:sum(int(s.attrib.get(k,0)) for s in suites) for k in ['tests','failures','errors','skipped']})
          PY
      - name: Publish only the tested source through a normal fast-forward
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code
          test "$(git write-tree)" = "$(cat review-evidence/TESTED_TREE.txt)"
          git -c user.name='MateLink remote implementation' -c user.email='matelink-remote@users.noreply.github.com' commit -m 'fix(android): wire scoped family reads partial costs and responsive local-first consumers'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD HEAD^{tree} HEAD^ > review-evidence/SOURCE_HEAD.txt
          git archive --format=zip HEAD > review-evidence/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-app-review-20261103
          retention-days: 14
          path: |
            review-evidence/
            android/app/build/test-results/testDebugUnitTest/
