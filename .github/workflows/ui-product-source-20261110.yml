name: UI product immutable source 20261110
on:
  push:
    branches: [codex/ui-product-app-20261109]
    paths: ['.github/workflows/ui-product-source-20261110.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export bounded source from separate immutable bases
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin dbeffe128cd6f37429c0b293255a25618f1a61c6 0913bf3795069e02a03dcae2c02dc8b05c09651e 520680a708b60589fbf3910871cc259bf1f01251 cb500aef439d31b1ae09dc2f16e191da267d5afd
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib
          out=Path('source');out.mkdir()
          refs={'app':('dbeffe128cd6f37429c0b293255a25618f1a61c6',['android/','tools/','.github/workflows/']), 'mini':('0913bf3795069e02a03dcae2c02dc8b05c09651e',['miniprogram/','tools/miniprogram/','.github/workflows/']), 'web':('520680a708b60589fbf3910871cc259bf1f01251',['web_matelink/','.github/workflows/']), 'ios':('cb500aef439d31b1ae09dc2f16e191da267d5afd',['ios/','.github/workflows/'])}
          receipt={}
          extensions={'.kt','.kts','.java','.ts','.tsx','.js','.jsx','.mjs','.mts','.cjs','.json','.html','.css','.scss','.yml','.yaml','.md','.py','.sh','.swift','.pbxproj','.plist','.xcconfig','.entitlements','.xcscheme','.xcworkspacedata','.lock','.properties','.xml','.toml'}
          for name,(ref,prefixes) in refs.items():
              paths=subprocess.check_output(['git','ls-tree','-r','--name-only',ref],text=True).splitlines();files=[]
              for p in paths:
                  if not any(p.startswith(x) for x in prefixes):continue
                  if any(x in p.lower() for x in ['node_modules/','/build/','/dist/','.env','local.properties','signing.properties','keystore','service-account','google-services.json']):continue
                  if Path(p).suffix.lower() not in extensions and Path(p).name not in ['gradlew','gradlew.bat']:continue
                  data=subprocess.check_output(['git','show',ref+':'+p]);dest=out/name/p;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
                  files.append({'path':p,'sha256':hashlib.sha256(data).hexdigest()})
              meta=subprocess.check_output(['git','show','-s','--format=%H%n%T%n%P',ref],text=True).splitlines()
              receipt[name]={'sha':ref,'tree':meta[1],'parents':meta[2].split() if len(meta)>2 else [],'files':files}
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2))
          print({k:len(v['files']) for k,v in receipt.items()})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ui-product-immutable-source
          path: source/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
