name: Scoped Mini review implementation and verification
on:
  push:
    branches: [codex/miniprogram-e-migration-20261029]
    paths:
      - tools/remote-review/mini-20261103*.py
      - tools/remote-review/mini-ci-template.yml
      - .github/workflows/scoped-mini-review-20261103.yml
permissions:
  contents: write
concurrency:
  group: scoped-mini-review-20261103
  cancel-in-progress: false
jobs:
  implement-and-test:
    if: github.repository == 'Jovifei/tesla-master-mimo' && github.ref == 'refs/heads/codex/miniprogram-e-migration-20261029'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 46ff7cda3f082a250c6a1468fa9aac6772767497
      TARGET_BRANCH: codex/miniprogram-e-migration-20261029
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact authorized source and generate guarded consumer edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mini-review-evidence
          test "$GITHUB_REPOSITORY" = 'Jovifei/tesla-master-mimo'
          test "$GITHUB_REF_NAME" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --name-only "$BASE_SHA" HEAD > /tmp/bootstrap-paths
          python3 - <<'PY'
          from pathlib import Path
          allowed={'.github/workflows/scoped-mini-review-20261103.yml',
            'tools/remote-review/mini-20261103.py', 'tools/remote-review/mini-20261103-prepare.py',
            'tools/remote-review/mini-20261103-tests.py', 'tools/remote-review/mini-ci-template.yml',
            'tools/remote-review/mini-20261103-corrections.py'}
          assert set(Path('/tmp/bootstrap-paths').read_text().splitlines()) <= allowed
          PY
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          python3 tools/remote-review/mini-20261103-prepare.py
          python3 tools/remote-review/mini-20261103-tests.py
          python3 tools/remote-review/mini-20261103-corrections.py
          # Contents-only runner publishes business source; the authorized connector seals CI separately.
          git diff --check
          git add miniprogram docs/REMOTE-AUDIT-MINI-20261103.md
          git diff --cached --binary > mini-review-evidence/source.patch
          git diff --cached --name-only > mini-review-evidence/changed-paths.txt
          python3 - <<'PY'
          from pathlib import Path
          paths=Path('mini-review-evidence/changed-paths.txt').read_text().splitlines()
          assert len(paths)>=18
          assert all(p.startswith('miniprogram/') or p=='docs/REMOTE-AUDIT-MINI-20261103.md' for p in paths)
          PY
          git write-tree > mini-review-evidence/TESTED_TREE.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            miniprogram/package-lock.json
            miniprogram/test-tooling/package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        working-directory: miniprogram
        run: |
          npm ci --ignore-scripts --no-fund
          npm ci --prefix test-tooling --ignore-scripts --no-fund
      - name: Full types native resources page tests and production WeChat build
        working-directory: miniprogram
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee ../mini-review-evidence/typecheck.log
          TZ=UTC npm test -- --reporter=default --reporter=junit --outputFile.junit=../mini-review-evidence/tests.xml 2>&1 | tee ../mini-review-evidence/tests.log
          npm run build:weapp 2>&1 | tee ../mini-review-evidence/build.log
          node -e "const p=require('./dist/project.config.json');if(p.setting.urlCheck!==true)throw Error('domain checks disabled')"
          python3 - <<'PY'
          import xml.etree.ElementTree as E
          r=E.parse('../mini-review-evidence/tests.xml').getroot()
          cases=r.findall('.//testcase')
          assert len(cases)>=954
          assert not r.findall('.//failure') and not r.findall('.//error')
          print('REAL_MINI_JUNIT',len(cases))
          PY
      - name: Repeat actual calendar cost storage and upgrade consumers in four timezones
        working-directory: miniprogram
        shell: bash
        run: |
          set -euo pipefail
          for zone in UTC Asia/Shanghai Asia/Tokyo America/Los_Angeles; do
            name="${zone//\//_}"
            TZ="$zone" node test-tooling/node_modules/vitest/vitest.mjs run --config test-tooling/vitest.config.mts \
              src/domain/history_query.test.ts src/domain/partial_charge_cost.test.ts \
              src/pages/wechat_startup.test.tsx src/pages/charge_cost_consistency.test.tsx src/services/cache_budget.test.ts \
              --reporter=default --reporter=junit --outputFile.junit="../mini-review-evidence/$name.xml" \
              2>&1 | tee "../mini-review-evidence/$name.log"
          done
      - name: Publish tested Mini source with normal fast-forward only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code
          test "$(git write-tree)" = "$(cat mini-review-evidence/TESTED_TREE.txt)"
          git -c user.name='MateLink remote implementation' -c user.email='matelink-remote@users.noreply.github.com' commit -m 'fix(mini): align cost evidence and local-first upgrade-safe page consumers'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD HEAD^{tree} HEAD^ > mini-review-evidence/SOURCE_HEAD.txt
          git archive --format=zip HEAD > mini-review-evidence/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-mini-review-20261103
          retention-days: 14
          path: mini-review-evidence/
