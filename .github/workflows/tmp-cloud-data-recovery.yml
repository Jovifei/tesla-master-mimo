name: Temporary cloud data recovery qualification

on:
  push:
    branches:
      - fix/20260907-cloud-data-recovery
    paths:
      - .github/workflows/tmp-cloud-data-recovery.yml

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/20260907-cloud-data-recovery
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/jourvolt-dev-mock/go.mod
      - name: Apply reviewed repair
        run: python tools/tmp_cloud_data_recovery_patch.py
      - name: Format Go
        working-directory: deploy/jourvolt-dev-mock
        run: gofmt -w fleet_provider.go fleet_provider_test.go telemetry_store.go telemetry_import_test.go
      - name: Go gate
        working-directory: deploy/jourvolt-dev-mock
        run: |
          go test ./... -count=1
          go vet ./...
          go mod verify
          go build ./...
      - name: Android gate
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon
          ./gradlew :app:testReleaseUnitTest --no-daemon
          ./gradlew :app:assembleDebug --no-daemon
          ./gradlew :app:assembleDebugAndroidTest --no-daemon
          ./gradlew :app:lintDebug --no-daemon
      - name: Diff gate
        run: git diff --check
      - name: Commit verified product repair
        run: |
          git config user.name "MateLink Build"
          git config user.email "110970864+Jovifei@users.noreply.github.com"
          git add deploy/jourvolt-dev-mock/fleet_provider.go deploy/jourvolt-dev-mock/fleet_provider_test.go deploy/jourvolt-dev-mock/telemetry_store.go deploy/jourvolt-dev-mock/telemetry_import_test.go android/app/src/main/java/com/matelink/data/local/VehicleContextStore.kt android/app/src/main/java/com/matelink/data/local/VehicleContextRepository.kt android/app/src/main/java/com/matelink/data/repository/UnifiedHistoryRepository.kt android/app/src/main/java/com/matelink/ui/screens/battery/BatteryViewModel.kt android/app/src/main/java/com/matelink/ui/screens/battery/BatteryScreen.kt android/app/src/main/java/com/matelink/ui/screens/readiness/DataReadinessViewModel.kt android/app/src/test/java/com/matelink/ui/screens/readiness/TelemetryAutoConfigurePolicyTest.kt
          git diff --cached --check
          git commit -m "fix(data): recover cloud location and local history truth"
          git push origin HEAD:fix/20260907-cloud-data-recovery
