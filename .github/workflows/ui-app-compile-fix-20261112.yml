name: Android refinement compile repair
on:
  push:
    branches: [codex/ui-product-app-20261109]
    paths: ['.github/workflows/ui-app-compile-fix-20261112.yml']
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'Jovifei/tesla-master-mimo'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact compiler repairs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c34a20d4505123e34bf37651b4642af858cb7467
          python3 - <<'PY'
          from pathlib import Path
          base=Path('android/app/src/main/java/com/matelink/ui')
          for rel,imp in [('screens/settings/SettingsScreen.kt','androidx.compose.material3.Surface'),('screens/readiness/DataReadinessScreen.kt','androidx.compose.material3.TextButton')]:
              p=base/rel;s=p.read_text();assert 'import '+imp+'\n' not in s
              s=s.replace('\nimport ', '\nimport '+imp+'\nimport ',1);p.write_text(s)
          p=base/'components/CalendarPresentation.kt';s=p.read_text();assert s.count('var date = end')==1
          p.write_text(s.replace('var date = end','var date: LocalDate = end'))
          PY
      - id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/java/com/matelink/ui/
          git rm .github/workflows/ui-app-compile-fix-20261112.yml
          git diff --cached --check
          git commit -m 'fix(android): import presentation surfaces and keep calendar cursor non-null'
          git push origin HEAD:refs/heads/codex/ui-product-app-20261109
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: repair
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.repair.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: bash tools/energy-stage/android-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-refinement-repaired-${{ needs.repair.outputs.sha }}
          path: |
            android-evidence/
            android/app/build/test-results/
            android/app/build/reports/
            android/app/build/outputs/apk/
          retention-days: 7
          if-no-files-found: error
