name: Implement scoped pressure visual consumers
on:
  push:
    branches: [codex/app-interaction-complete-20261106]
    paths:
      - tools/interaction-stage/app-pressure-20261106.py
      - .github/workflows/interaction-pressure-implement.yml
permissions:
  contents: read
concurrency:
  group: interaction-pressure-implement
  cancel-in-progress: false
jobs:
  implement:
    if: github.repository == 'Jovifei/tesla-master-mimo' && github.ref == 'refs/heads/codex/app-interaction-complete-20261106'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/app-interaction-complete-20261106
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source lease and apply reviewed exact-anchor patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 1eba8efae50f4b61877b4019e57d621e90b994a4 HEAD
          mkdir -p pressure-evidence
          git rev-parse HEAD HEAD^{tree} HEAD^ > pressure-evidence/runner-source.txt
          python3 tools/interaction-stage/app-pressure-20261106.py
          git diff --check
          git diff --binary > pressure-evidence/source.patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Run real focused consumers, identity races and compile native tests
        shell: bash
        env:
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          backup="$(mktemp)"
          cp android/gradle.properties "$backup"
          trap 'cp "$backup" android/gradle.properties; rm -f "$backup"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/gradle.properties')
          keys={'systemProp.http.proxyHost','systemProp.http.proxyPort','systemProp.https.proxyHost','systemProp.https.proxyPort','systemProp.http.nonProxyHosts'}
          p.write_text('\n'.join(line for line in p.read_text().splitlines() if line.split('=',1)[0] not in keys)+'\n')
          PY
          set +e
          (cd android && bash gradlew :app:testDebugUnitTest --tests '*InteractionEvidencePresentationTest' --tests '*ConfiguredPressureVisualTest' --tests '*TpmsProfileVisualPipelineTest' --tests '*TpmsTrendPresentationTest' --tests '*TpmsTrendIdentityRecoveryTest' :app:assembleDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process) > pressure-evidence/gradle.log 2>&1
          status=$?
          set -e
          tail -n 90 pressure-evidence/gradle.log
          test "$status" = 0
          python3 - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as E
          roots=[E.parse(p).getroot() for p in Path('android/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          cases=[c for root in roots for c in root.findall('.//testcase')]
          result={'tests':len(cases),'failures':sum(len(c.findall('failure')) for c in cases),'errors':sum(len(c.findall('error')) for c in cases),'skips':sum(len(c.findall('skipped')) for c in cases)}
          assert result['tests']>=20 and not result['failures'] and not result['errors'] and not result['skips'],result
          Path('pressure-evidence/counts.json').write_text(json.dumps(result))
          print(result)
          PY
      - name: Commit actual tested sources with a normal fast-forward lease
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- android/gradle.properties deploy ios miniprogram web_matelink android/app/schemas
          git add android/app/src/main/java/com/matelink/ui/components/InteractionVisuals.kt android/app/src/main/java/com/matelink/ui/components/InteractionEvidencePresentation.kt android/app/src/main/java/com/matelink/ui/screens/tpms/TpmsTrendViewModel.kt android/app/src/main/java/com/matelink/ui/screens/tpms/TpmsTrendScreen.kt android/app/src/main/res/values/interaction_evidence.xml android/app/src/main/res/values-zh/interaction_evidence.xml android/app/src/test/java/com/matelink/ui/components/ConfiguredPressureVisualTest.kt android/app/src/test/java/com/matelink/ui/screens/tpms/TpmsProfileVisualPipelineTest.kt android/app/src/androidTest/java/com/matelink/InteractionEvidenceAndroidTest.kt tools/interaction-stage/verify-complete-preservation.py
          git diff --cached --check
          git config user.name 'Jovifei'
          git config user.email '110970864+Jovifei@users.noreply.github.com'
          git commit -m 'fix(app): connect qualified per-vehicle pressure settings to real wheel visuals'
          python3 tools/interaction-stage/verify-complete-preservation.py > pressure-evidence/preservation.json
          git rev-parse HEAD HEAD^{tree} HEAD^ > pressure-evidence/tested-source.txt
          git archive --format=zip --output=pressure-evidence/tested-source.zip HEAD
          git fetch origin codex/app-interaction-complete-20261106
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/app-interaction-complete-20261106
          echo 'Actual tested source pushed; final full-source workflow still required.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-pressure-implementation
          retention-days: 14
          path: |
            pressure-evidence/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/outputs/apk/androidTest/
