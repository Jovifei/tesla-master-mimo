name: Android UI refinement 20261111
on:
  push:
    branches: [codex/ui-product-app-20261109]
    paths: ['.github/workflows/ui-app-refine-20261111.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'Jovifei/tesla-master-mimo' && github.ref == 'refs/heads/codex/ui-product-app-20261109'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply reviewed bounded ordinary source refinements
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1c02bf28ad726ddd6836f883e86d9adbf7c27aba
          python3 - <<'PY'
          from pathlib import Path
          def edit(path,old,new):
              p=Path(path);s=p.read_text();assert s.count(old)==1,(path,s.count(old));p.write_text(s.replace(old,new))
          grid='android/app/src/main/java/com/matelink/ui/components/ChargeActivityGrid.kt'
          edit(grid,'import androidx.compose.ui.semantics.contentDescription','import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.luminance\nimport androidx.compose.ui.semantics.selected\nimport androidx.compose.ui.semantics.contentDescription')
          edit(grid,'data class ChargeActivityCell(val label: String, val value: Double?, val display: String)', '''data class ChargeActivityCell(
              val label: String, val value: Double?, val display: String,
              val key: String = label, val precision: Int = 1, val approximate: Boolean = false
          )
          internal fun chargeCellNumber(cell: ChargeActivityCell): String {
              val value = cell.value?.takeIf { it.isFinite() && it >= 0 } ?: return "—"
              return (if (cell.approximate) "≈" else "") + formatTelemetryNumber(value, cell.precision.coerceIn(0, 2))
          }''')
          edit(grid,'fun ChargeActivityGrid(cells: List<ChargeActivityCell>, modifier: Modifier = Modifier) {','fun ChargeActivityGrid(cells: List<ChargeActivityCell>, modifier: Modifier = Modifier, scopeKey: String = "") {')
          p=Path(grid);s=p.read_text().replace('remember(cells.map { it.label })','remember(scopeKey, cells.map { it.key })').replace('it.label == selected','it.key == selected').replace('selected = cell.label','selected = cell.key').replace('${cell.label}").semantics { contentDescription = "${cell.label}, ${cell.display}" }','${cell.key}").semantics { contentDescription = "${cell.label}, ${cell.display}"; this.selected = selected == cell.key }').replace('selected == cell.label','selected == cell.key')
          s=s.replace('val foreground = if (intensity > .5f) MaterialTheme.colorScheme.onPrimary else MaterialTheme.colorScheme.onSurface','''val background = androidx.compose.ui.graphics.lerp(MaterialTheme.colorScheme.surfaceVariant, MaterialTheme.colorScheme.primary, intensity)
                                      // Pick the stronger actual contrast, not a threshold on chart intensity.
                                      val foreground = if (background.luminance() > 0.179f) Color.Black else Color.White''').replace('color = androidx.compose.ui.graphics.lerp(MaterialTheme.colorScheme.surfaceVariant, MaterialTheme.colorScheme.primary, intensity),','color = background,').replace('Text(if (cell.value == null) "—" else formatTelemetryNumber(cell.value, 1),','Text(chargeCellNumber(cell),');p.write_text(s)
          charges='android/app/src/main/java/com/matelink/ui/screens/charges/ChargesScreen.kt'
          edit(charges,'ChargeActivityCell(data.label, value, display)','''ChargeActivityCell(data.label, value, display,
                          key = "${granularity.name}:${data.sortKey}",
                          precision = when (chartType) { ChargesChartType.COUNT -> 0; ChargesChartType.COST -> 2; else -> 1 },
                          approximate = approximate)''')
          edit(charges,'ChargeActivityGrid(cells = cells)','ChargeActivityGrid(cells = cells, scopeKey = "${granularity.name}:${chartType.name}:$axisUnit")')
          stack='android/app/src/main/java/com/matelink/ui/components/VerticalDayStack.kt'
          edit(stack,'    val current = groups[index]','''    val current = groups[index]
              LaunchedEffect(scopeKey, groups.map { it.dateKey }) {
                  if (selectedKey != null && groups.none { it.dateKey == selectedKey }) selectedKey = null
              }''')
          edit(stack,'Column(Modifier.fillMaxWidth().testTag("day_stack_gesture")','Column(Modifier.fillMaxWidth().heightIn(min = 96.dp).testTag("day_stack_gesture")')
          edit(stack,'Modifier.weight(1f).testTag("day_stack_active_date")','Modifier.weight(1f).testTag("day_stack_active_date").semantics { liveRegion = LiveRegionMode.Polite }')
          test='android/app/src/androidTest/java/com/matelink/ui/components/UiProductContractAndroidTest.kt'
          edit(test,'        val neutral = renderedColor','        compose.waitForIdle()\n        val neutral = renderedColor')
          p=Path(test);s=p.read_text();pos=s.rfind('\n}')
          s=s[:pos]+'''
              @Test fun refreshKeepsTheSelectedDateButUsesFreshRecords() {
                  val source = mutableStateOf(groups)
                  compose.setContent { MateLinkTheme(darkTheme = false) {
                      VerticalDayStack(source.value, "refresh-scope") { group -> group.items.forEach { Text(it) } }
                  } }
                  compose.onNodeWithTag("day_stack_older").performClick()
                  compose.runOnIdle { source.value = groups.map { if (it.dateKey == groups[1].dateKey) it.copy(items = listOf("corrected-day-1")) else it } }
                  compose.onNodeWithText("corrected-day-1").assertIsDisplayed()
                  compose.onNodeWithText("drive-1").assertDoesNotExist()
                  compose.onNodeWithTag("day_stack_gesture").performTouchInput {
                      down(center); moveBy(androidx.compose.ui.geometry.Offset(0f, -30f)); cancel()
                  }
                  compose.onNodeWithText("corrected-day-1").assertIsDisplayed()
                  compose.runOnIdle { source.value = groups.take(1) }
                  compose.onNodeWithText("drive-0").assertIsDisplayed()
                  compose.runOnIdle { source.value = groups }
                  compose.onNodeWithText("drive-0").assertIsDisplayed()
              }
              @Test fun chargeCellsKeepPrecisionQualityAndDistinctStableKeys() {
                  compose.setContent { MateLinkTheme(darkTheme = false) {
                      ChargeActivityGrid(listOf(
                          ChargeActivityCell("11/09", 0.0, "0 sessions", key = "2025-11-09", precision = 0),
                          ChargeActivityCell("11/09", 1.25, "estimated 1.25", key = "2026-11-09", precision = 2, approximate = true)))
                  } }
                  compose.onNodeWithText("0").assertIsDisplayed()
                  compose.onNodeWithText("≈1.25").assertIsDisplayed()
                  compose.onNodeWithTag("charge_cell_2025-11-09").performClick().assertIsSelected()
                  compose.onNodeWithTag("charge_cell_selection").assertTextEquals("11/09 · 0 sessions")
                  compose.onNodeWithTag("charge_cell_2026-11-09").performClick().assertIsSelected()
                  compose.onNodeWithTag("charge_cell_selection").assertTextEquals("11/09 · estimated 1.25")
              }
          '''+s[pos:];p.write_text(s)
          PY
      - id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/
          git rm .github/workflows/ui-app-refine-20261111.yml
          git diff --cached --check
          git commit -m 'feat(android): preserve grid precision quality and stable keys; refine day gestures and regressions'
          git push origin HEAD:refs/heads/codex/ui-product-app-20261109
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  full-build:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: bash tools/energy-stage/android-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-stage-build-${{ needs.apply.outputs.sha }}
          path: |
            android-evidence/
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/outputs/apk/
          retention-days: 7
          if-no-files-found: error
  native-ui:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.apply.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Prepare disposable hosted runner only
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          mkdir -p emulator-evidence
          git rev-parse HEAD HEAD^{tree} HEAD^ > emulator-evidence/SOURCE_HEAD.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/gradle.properties')
          keys={'systemProp.http.proxyHost','systemProp.http.proxyPort','systemProp.https.proxyHost','systemProp.https.proxyPort','systemProp.http.nonProxyHosts'}
          p.write_text('\n'.join(x for x in p.read_text().splitlines() if x.split('=',1)[0] not in keys)+'\n')
          PY
          cat > emulator-evidence/run.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          test "$(adb devices | awk 'NR>1 && $2=="device" {print $1}')" = emulator-5554
          test "$(adb -s emulator-5554 shell getprop ro.kernel.qemu | tr -d '\r')" = 1
          adb -s emulator-5554 shell settings put global airplane_mode_on 1
          adb -s emulator-5554 shell svc wifi disable
          if adb -s emulator-5554 shell service check phone | grep -q 'not found'; then
            echo 'ATD image has no telephony service; airplane mode and Wi-Fi isolation remain enabled.'
          else
            adb -s emulator-5554 shell svc data disable
          fi
          trap 'adb -s emulator-5554 pull /sdcard/Android/data/com.matelink.test.mock/files/ui-product-evidence emulator-evidence/screenshots || true' EXIT
          bash android/gradlew -p android :app:connectedDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseSerialGC' -Pkotlin.compiler.execution.strategy=in-process -PallowConnectedDeviceTests=isolated-device -PMATELINK_INSTRUMENTATION_CLASSES=com.matelink.ui.components.UiProductContractAndroidTest -PJOURVOLT_API_BASE_URL=http://127.0.0.1:18090/ -PJOURVOLT_AUTH_HOST=auth.teslalink.joviluma.com 2>&1 | tee emulator-evidence/tests.log
          SH
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_4
          cores: 2
          ram-size: 3072M
          heap-size: 384M
          disk-size: 8G
          emulator-boot-timeout: 700
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -no-snapshot-save -no-metrics -accel on
          script: bash emulator-evidence/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-stage-native-${{ needs.apply.outputs.sha }}
          path: |
            emulator-evidence/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
          retention-days: 7
          if-no-files-found: error
